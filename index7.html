<!DOCTYPE html>
<html lang="uz">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>2-son Ixtisoslashtirilgan Maktab | Ultra Edition</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@200;400;600;800&display=swap"
        rel="stylesheet">
    <style>
        :root {
            --p: #00f2fe;
            --s: #ff00ff;
            --bg: #000000;
            --card-bg: rgba(255, 255, 255, 0.03);
            --border: rgba(255, 255, 255, 0.12);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Plus Jakarta Sans', sans-serif;
            cursor: none;
        }

        body {
            background-color: var(--bg);
            color: #fff;
            overflow-x: hidden;
            min-height: 100vh;
        }

        /* 1. PROFESSIONAL LOADER */
        #loader {
            position: fixed;
            inset: 0;
            background: #000;
            z-index: 10005;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            transition: 1s cubic-bezier(0.8, 0, 0.2, 1);
        }

        .loader-circle {
            width: 100px;
            height: 100px;
            border: 2px solid transparent;
            border-top: 2px solid var(--p);
            border-right: 2px solid var(--s);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }

        .loader-text {
            margin-top: 20px;
            color: var(--p);
            letter-spacing: 5px;
            font-weight: 800;
            font-size: 10px;
            text-transform: uppercase;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        /* 2. DYNAMIC NEURAL BACKGROUND */
        #cyber-bg {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
        }

        /* 3. CUSTOM CURSOR */
        #cursor-dot {
            width: 6px;
            height: 6px;
            background: #fff;
            position: fixed;
            border-radius: 50%;
            pointer-events: none;
            z-index: 10001;
            box-shadow: 0 0 15px var(--p);
        }

        #cursor-ring {
            width: 40px;
            height: 40px;
            border: 1.5px solid var(--p);
            position: fixed;
            border-radius: 50%;
            pointer-events: none;
            z-index: 10000;
            transition: transform 0.15s ease-out;
        }

        /* 4. CONTENT WRAPPER */
        .wrapper {
            max-width: 1400px;
            margin: 0 auto;
            padding: 100px 20px;
            opacity: 0;
            transform: translateY(50px);
            transition: 1.5s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .wrapper.active {
            opacity: 1;
            transform: translateY(0);
        }

        /* 5. STYLED HEADER */
        header {
            text-align: center;
            margin-bottom: 120px;
            position: relative;
        }

        header .sub-title {
            color: var(--p);
            letter-spacing: 12px;
            font-size: 14px;
            font-weight: 800;
            text-transform: uppercase;
            margin-bottom: 15px;
            display: block;
        }

        header h1 {
            font-size: clamp(2.5rem, 8vw, 5rem);
            font-weight: 800;
            line-height: 1;
            background: linear-gradient(135deg, #fff 0%, var(--p) 50%, var(--s) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            filter: drop-shadow(0 0 30px rgba(0, 242, 254, 0.3));
            animation: titlePulse 3s infinite alternate;
        }

        @keyframes titlePulse {
            from {
                filter: drop-shadow(0 0 20px rgba(0, 242, 254, 0.2));
            }

            to {
                filter: drop-shadow(0 0 40px rgba(255, 0, 255, 0.4));
            }
        }

        /* 6. GRID & CARDS */
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
            gap: 30px;
        }

        .card {
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 30px;
            padding: 50px 35px;
            text-decoration: none;
            position: relative;
            overflow: hidden;
            backdrop-filter: blur(20px);
            transition: 0.5s cubic-bezier(0.2, 1, 0.3, 1);
            display: block;
        }

        .card:hover {
            transform: translateY(-15px) scale(1.02);
            border-color: var(--p);
            background: rgba(255, 255, 255, 0.06);
            box-shadow: 0 30px 60px rgba(0, 0, 0, 0.5);
        }

        .icon {
            font-size: 55px;
            margin-bottom: 30px;
            display: block;
            transition: 0.4s;
        }

        .card:hover .icon {
            transform: scale(1.2) rotate(-5deg);
            filter: drop-shadow(0 0 15px var(--p));
        }

        .card h3 {
            font-size: 24px;
            font-weight: 700;
            color: #fff;
            margin-bottom: 15px;
        }

        .card p {
            font-size: 15px;
            color: #94a3b8;
            line-height: 1.8;
        }

        .scan {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 2px;
            background: linear-gradient(90deg, transparent, var(--p), transparent);
            opacity: 0;
        }

        .card:hover .scan {
            opacity: 1;
            animation: scanning 2s linear infinite;
        }

        @keyframes scanning {
            0% {
                top: 0;
            }

            100% {
                top: 100%;
            }
        }
    </style>
</head>

<body>

    <div id="loader">
        <div class="loader-circle"></div>
        <div class="loader-text" id="status">INITIATING SYSTEM...</div>
    </div>

    <div id="cursor-dot"></div>
    <div id="cursor-ring"></div>
    <canvas id="cyber-bg"></canvas>

    <div class="wrapper" id="main-content">
        <header>
            <span class="sub-title">Ultra Digital Frontier</span>
            <h1>2-son <br> Ixtisoslashtirilgan Maktab</h1>
        </header>

        <div class="grid" id="menu-grid"></div>
    </div>

    <script>
        // BO'LIMLAR VA LINKLAR
        const sections = [
            { t: "Sinfxonalar", i: "🏢", d: "Interaktiv texnologiyalar bilan jihozlangan o'quv xonalari.", link: "sinfxonalar.html" },
            { t: "O'qituvchilar", i: "👨‍🎓", d: "Xalqaro toifadagi akademik mentorlar jamoasi.", link: "oqutuvchilar.html" },
            { t: "IT Akademiya", i: "💻", d: "Dasturlash, robototexnika va AI innovatsion kurslari.", link: "it-akademiya.html" },
            { t: "Media Markaz", i: "📖", d: "Elektron resurslar va dunyo kutubxonalariga ulanish.", link: "media.html" },
            { t: "Sport Hub", i: "🏆", d: "Olimpiya standartidagi sport zallari majmuasi.", link: "sport.html" },
            { t: "Science Lab", i: "🧪", d: "Fizika, kimyo va biologiya laboratoriyalari.", link: "science.html" },
            { t: "Oshxona", i: "🍱", d: "O'quvchilar uchun maxsus vitaminli kunlik menyu.", link: "oshxona.html" },
            { t: "Reyting", i: "📈", d: "Akademik yutuqlarning real vaqtdagi monitoringi.", link: "reyting.html" },
            { t: "Tadbirlar", i: "✨", d: "Maktab hayotidagi madaniy va ilmiy voqealar.", link: "tadbirlar.html" },
            { t: "Shaxmat", i: "♟️", d: "Strategik tafakkurni rivojlantirish klubi.", link: "shaxmat.html" },
            { t: "Psixolog", i: "🤝", d: "Individual motivatsiya va ruhiy qo'llab-quvvatlash.", link: "psixolog.html" },
            { t: "Bog'lanish", i: "📞", d: "Ma'muriyat bilan tezkor muloqot portali.", link: "aloqa.html" }
        ];

        const grid = document.getElementById('menu-grid');
        sections.forEach(s => {
            grid.innerHTML += `
                <a href="${s.link}" class="card">
                    <div class="scan"></div>
                    <span class="icon">${s.i}</span>
                    <h3>${s.t}</h3>
                    <p>${s.d}</p>
                </a>
            `;
        });

        // CURSOR SCRIPT
        const dot = document.getElementById('cursor-dot');
        const ring = document.getElementById('cursor-ring');
        let mx = 0, my = 0;
        window.addEventListener('mousemove', e => {
            mx = e.clientX; my = e.clientY;
            dot.style.left = mx + 'px'; dot.style.top = my + 'px';
            ring.style.left = (mx - 20) + 'px'; ring.style.top = (my - 20) + 'px';
        });

        // NEURAL BACKGROUND SCRIPT
        const canvas = document.getElementById('cyber-bg');
        const ctx = canvas.getContext('2d');
        let pts = [];

        function init() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
            pts = [];
            for (let i = 0; i < 160; i++) {
                pts.push({
                    x: Math.random() * canvas.width,
                    y: Math.random() * canvas.height,
                    vx: (Math.random() - 0.5) * 0.9,
                    vy: (Math.random() - 0.5) * 0.9,
                    c: Math.random() > 0.5 ? '#00f2fe' : '#ff00ff'
                });
            }
        }

        function draw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            pts.forEach((p, i) => {
                p.x += p.vx; p.y += p.vy;
                if (p.x < 0 || p.x > canvas.width) p.vx *= -1;
                if (p.y < 0 || p.y > canvas.height) p.vy *= -1;

                let distM = Math.hypot(mx - p.x, my - p.y);
                if (distM < 250) {
                    ctx.strokeStyle = p.c;
                    ctx.globalAlpha = (1 - distM / 250) * 0.5;
                    ctx.beginPath(); ctx.moveTo(p.x, p.y); ctx.lineTo(mx, my); ctx.stroke();
                }

                for (let j = i + 1; j < pts.length; j++) {
                    let p2 = pts[j];
                    let d = Math.hypot(p.x - p2.x, p.y - p2.y);
                    if (d < 180) {
                        ctx.strokeStyle = p.c;
                        ctx.globalAlpha = (1 - d / 180) * 0.3;
                        ctx.lineWidth = 0.6;
                        ctx.beginPath(); ctx.moveTo(p.x, p.y); ctx.lineTo(p2.x, p2.y); ctx.stroke();
                    }
                }
            });
            requestAnimationFrame(draw);
        }

        // LOADER
        window.addEventListener('load', () => {
            const status = document.getElementById('status');
            setTimeout(() => status.innerText = "CALIBRATING INTERFACE...", 600);
            setTimeout(() => status.innerText = "ESTABLISHING NEURAL LINK...", 1200);
            setTimeout(() => {
                document.getElementById('loader').style.transform = "translateY(-100%)";
                document.getElementById('main-content').classList.add('active');
            }, 2000);
        });

        init(); draw();
        window.addEventListener('resize', init);
    </script>
</body>

</html>
